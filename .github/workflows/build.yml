name: Build

on:
  push:
    branches: [ main, master ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Linux (Ubuntu) ネイティブビルド + テスト
  # ──────────────────────────────────────────────────────────────────────────────
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libexpat1-dev libinih-dev libicu-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Sanitizer build and test (ASan/UBSan)
        run: |
          cmake -B build-san -DCMAKE_BUILD_TYPE=Debug -DRM2K_SANITIZE=ON -G Ninja
          cmake --build build-san -j$(nproc)
          ctest --test-dir build-san --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2s-linux
          path: build/r2s

  # ──────────────────────────────────────────────────────────────────────────────
  # Windows ネイティブビルド (MSVC, windows-latest runner)
  # ──────────────────────────────────────────────────────────────────────────────
  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (vcpkg)
        run: vcpkg install expat inih icu --triplet x64-windows-static

      - name: Configure
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DLIBLCF_WITH_ICU=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2s-windows-msvc
          path: build/Release/r2s.exe

  # ──────────────────────────────────────────────────────────────────────────────
  # Windows (MinGW-w64 クロスコンパイル、Ubuntu上で実行)
  # ──────────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows (MinGW cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            mingw-w64-tools

      - name: Cache Windows sysroot
        uses: actions/cache@v4
        id: cache-sysroot
        with:
          path: win-sysroot
          key: win-sysroot-${{ hashFiles('Makefile') }}-v2

      - name: Build Windows dependencies
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        run: make win64-deps

      - name: Build rm2kscript.exe
        run: make win64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2s-windows
          path: build-win/r2s.exe

  # ──────────────────────────────────────────────────────────────────────────────
  # リリース時に両バイナリを添付
  # ──────────────────────────────────────────────────────────────────────────────
  release:
    name: Release
    needs: [ linux, windows, windows-msvc ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r2s-linux
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: r2s-windows
          path: dist/windows-mingw

      - uses: actions/download-artifact@v4
        with:
          name: r2s-windows-msvc
          path: dist/windows-msvc

      - name: Prepare assets
        run: |
          chmod +x dist/linux/r2s
          mv dist/linux/r2s            dist/r2s-linux-x86_64
          mv dist/windows-mingw/r2s.exe dist/r2s-windows-x86_64.exe
          mv dist/windows-msvc/r2s.exe  dist/r2s-windows-msvc-x86_64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/r2s-linux-x86_64
            dist/r2s-windows-x86_64.exe
            dist/r2s-windows-msvc-x86_64.exe
